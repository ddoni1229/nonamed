<style>
  :root{
    --bg: #F1ECE3;
    --bg-2: #E8E1D4;
    --ink: #1F1A14;
    --ink-2: #5A5247;
    --ink-3: #8B8273;
    --line: #1F1A14;
    --card: #FBF8F2;
    --accent: oklch(0.68 0.13 45);     /* warm terracotta */
    --accent-ink: oklch(0.32 0.08 45);
    --good: oklch(0.62 0.12 150);
    --bad:  oklch(0.58 0.18 25);
    --r-input: 999px;
    --r-card: 50%;
    --shadow-soft: 0 30px 80px -20px rgba(31,26,20,.18),
                   0 8px 24px -8px rgba(31,26,20,.10);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR","Pretendard",ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";
    min-height:100vh;overflow-x:hidden;
    word-break: keep-all; overflow-wrap: break-word;}

  /* Soft warm radial wash */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60% 50% at 20% 15%, rgba(217,119,87,.10), transparent 60%),
      radial-gradient(70% 60% at 85% 95%, rgba(165,143,103,.16), transparent 65%),
      radial-gradient(40% 35% at 50% 110%, rgba(31,26,20,.06), transparent 70%);
  }

  .stage{
    position:relative;z-index:1;
    min-height:100vh;
    display:grid;
    grid-template-columns: 1fr;
    place-items:center;
    padding: clamp(24px, 4vw, 56px);
  }

  /* Brand mark in top-left */
  .brandbar{
    position:fixed;top:28px;left:32px;z-index:5;
    display:flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.02em;color:var(--ink-2);
  }
  .brandbar-mark{ width:34px;height:34px;display:block;overflow:visible; }
  .brandbar b{font-weight:600;color:var(--ink)}

  .footbar{
    position:fixed;bottom:22px;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center;
    padding:0 32px;font-family:"JetBrains Mono",monospace;
    font-size:11px;color:var(--ink-3);letter-spacing:.04em;
  }
  .footbar .v{display:flex;gap:18px}
  .footbar .v span::before{content:"·";margin-right:8px;color:#bbac8c}
  .footbar .v span:first-child::before{content:"";margin:0}

  #app{width:100%;display:flex;justify-content:center}
</style>
</head>
